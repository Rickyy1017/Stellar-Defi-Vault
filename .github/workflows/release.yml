name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build, SBOM & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # cargo-cyclonedx generates the SBOM from Cargo.toml + Cargo.lock.
      # --locked ensures the build and the SBOM use exactly the locked versions.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --locked --format json --output-file sbom.cdx.json

      # Wasm build is currently disabled due to dual-contract symbol conflict;
      # see the TODO in ci.yml. When that is resolved, re-enable the lines below.
      # - name: Build Wasm release
      #   run: cargo build --target wasm32-unknown-unknown --release --locked
      # - name: Compute Wasm SHA-256
      #   run: |
      #     sha256sum target/wasm32-unknown-unknown/release/stellar_defi_vault.wasm \
      #       > stellar_defi_vault.wasm.sha256

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            sbom.cdx.json
          # Uncomment when Wasm build is re-enabled:
          # files: |
          #   target/wasm32-unknown-unknown/release/stellar_defi_vault.wasm
          #   stellar_defi_vault.wasm.sha256
          #   sbom.cdx.json
