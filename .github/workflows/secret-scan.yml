name: Secret Scanning

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Full-history scan every Monday at 03:00 UTC (#851).
    - cron: "0 3 * * 1"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch the full history so the scheduled run can scan every commit.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Point gitleaks at our allowlist so known false positives
          # (testnet public addresses, example values) are not flagged.
          args: detect --config .gitleaks.toml --redact --verbose
